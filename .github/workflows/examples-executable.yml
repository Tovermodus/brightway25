name: Check that documented examples are executable

on:
  push:
    branches: ["main"]
    paths:
      - "docs/site/examples/index.html"
      - "docs/tests/test_examples_executable.py"
      - "pyproject.toml"
      - ".github/workflows/examples-executable.yml"
  pull_request:
    paths:
      - "docs/site/examples/index.html"
      - "docs/tests/test_examples_executable.py"
      - "pyproject.toml"
      - ".github/workflows/examples-executable.yml"
  workflow_dispatch: {}

jobs:
  run-examples:
    name: Run every example script and diff its output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brightway25 + all documented packages
        run: pip install -e ".[dev]"
      - name: Execute every example in docs/site/examples/index.html
        run: python docs/tests/test_examples_executable.py
