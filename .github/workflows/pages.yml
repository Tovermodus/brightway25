name: Deploy code map to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/site/**"
      - "docs/generate_api_docs.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brightway25 + all documented packages
        run: pip install -e ".[dev]"
      - name: Generate API reference (docs/generate_api_docs.py)
        run: python docs/generate_api_docs.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
